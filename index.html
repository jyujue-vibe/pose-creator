<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pose Prompt Maker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @font-face { font-family: 'Yati Sans'; src: url('Yati_Sans_Variation.ttf') format('truetype'); }
  body { font-family: 'Yati Sans', -apple-system, 'Segoe UI', Roboto, sans-serif; background: #14161c; color: #e8eaf0; padding: 24px 24px 260px; max-width: 980px; margin: 0 auto; }
  button, input { font-family: inherit; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #9aa0b4; font-size: 13px; margin-bottom: 20px; }
  .topbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .topbar label { font-size: 13px; color: #9aa0b4; }
  input[type=text] { background: #1e2230; border: 1px solid #343a4f; color: #e8eaf0; border-radius: 8px; padding: 8px 12px; font-size: 14px; width: 200px; }
  .toggle { display: flex; background: #1e2230; border-radius: 8px; overflow: hidden; border: 1px solid #343a4f; }
  .toggle button { background: none; border: none; color: #9aa0b4; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .toggle button.active { background: #4f7cff; color: #fff; }
  .section { background: #1a1e29; border: 1px solid #2a3044; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8f96ad; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: #232839; border: 1px solid #343a4f; color: #cfd4e4; border-radius: 12px; padding: 7px 14px; font-size: 13px; cursor: pointer; transition: all .15s; }
  .chip:hover { border-color: #4f7cff; }
  .chip.selected { background: #4f7cff; border-color: #4f7cff; color: #fff; }
  .chip small { display: block; font-size: 10px; line-height: 1.4; opacity: .8; font-weight: 400; margin-top: 1px; }
  .preset small { display: block; font-size: 10px; opacity: .7; font-weight: 400; }
  .preset-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .preset { background: #2a2136; border: 1px solid #5a4480; color: #d8c9f5; border-radius: 10px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .preset:hover { background: #372b47; }
  .output-wrap { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1e29; border-top: 1px solid #4f7cff; padding: 14px 24px; z-index: 10; }
  .output-inner { max-width: 980px; margin: 0 auto; }
  .tabbar { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { background: #1e2230; border: 1px solid #343a4f; color: #9aa0b4; border-radius: 10px; padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tab.active { background: #4f7cff; border-color: #4f7cff; color: #fff; }
  .preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .preset-grid .preset { text-align: left; }
  .saved-wrap { position: relative; display: inline-block; }
  .saved-x { position: absolute; top: -7px; right: -5px; width: 18px; height: 18px; border-radius: 50%; background: #3a2330; border: 1px solid #6b3040; color: #ff8a8a; font-size: 10px; line-height: 16px; text-align: center; cursor: pointer; }
  .saved-x:hover { background: #55283a; }
  .lock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lock-card { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #232839; border: 1px solid #343a4f; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .lock-card.on { border-color: #4f7cff; }
  .lock-title { font-size: 13px; font-weight: 600; }
  .lock-mm { font-size: 11px; color: #9aa0b4; margin-top: 2px; }
  .switch { width: 42px; height: 24px; border-radius: 12px; background: #343a4f; border: none; cursor: pointer; position: relative; flex-shrink: 0; transition: background .15s; padding: 0; }
  .switch.on { background: #4f7cff; }
  .switch .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on .knob { left: 21px; }
  .preset-h { font-size: 13px; color: #8f96ad; text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 8px; }
  .preset-h:first-child { margin-top: 0; }
  .preset-empty { color: #6b7288; font-size: 13px; grid-column: 1 / -1; }
  #presetModal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-box { background: #1a1e29; border: 1px solid #343a4f; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; }
  .modal-box h3 { margin-bottom: 14px; font-size: 16px; }
  .modal-box label { display: block; font-size: 13px; color: #9aa0b4; margin-bottom: 12px; }
  .modal-box input { width: 100%; margin-top: 6px; }
  .hold-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #343a4f; }
  .hold-label { font-size: 13px; color: #8f96ad; }
  .hold-row input[type=text] { flex: 1; min-width: 140px; }
  .pair-wrap { background: #1a1e29; border: 1px solid #2a3044; border-radius: 12px; padding: 12px; margin-bottom: 14px; }
  .pair-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .pair-head h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8f96ad; }
  .pair-head-right { display: flex; gap: 8px; align-items: center; }
  .pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pair-grid .section { margin-bottom: 0; }
  .both-toggle { background: #232839; border: 1px solid #343a4f; color: #9aa0b4; border-radius: 16px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .both-toggle.on { background: #4f7cff; border-color: #4f7cff; color: #fff; }
  @media (max-width: 820px) {
    .pair-grid { grid-template-columns: 1fr; }
    .lock-grid { grid-template-columns: 1fr; }
  }
  .output-wrap h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8f96ad; margin-bottom: 10px; }
  #output { background: #10131b; border-radius: 8px; padding: 14px; font-size: 14px; line-height: 1.7; min-height: 70px; color: #f0e6c8; white-space: pre-wrap; }
  .btnrow { display: flex; gap: 10px; margin-top: 12px; }
  button.action { border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; font-weight: 600; }
  #copyBtn { background: #4f7cff; color: #fff; flex: 1; }
  #copyBtn:hover { background: #3d63d6; }
  #clearBtn { background: #2a3044; color: #cfd4e4; }
  #randomBtn { background: #2a3044; color: #cfd4e4; }
  #copied { color: #7ee2a8; font-size: 13px; margin-left: 8px; opacity: 0; transition: opacity .3s; }
  .x { background: none; border: none; color: #ff6b6b; font-size: 12px; font-weight: 600; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .x:hover { color: #ff9c9c; background: #2a2130; }
</style>
</head>
<body>
<h1>🎭 Pose Prompt Maker</h1>
<p class="sub">Pick each body part, get a ready-to-paste prompt. Runs fully offline — just open this file.</p>

<div class="topbar">
  <label>Character <input type="text" id="charName" placeholder="e.g. Lumo, a small tattoo dog" style="width:300px"></label>
  <button class="action" id="saveCharBtn" style="background:#2a3044;color:#cfd4e4;padding:8px 14px;font-size:13px;">💾 Save character</button>
</div>
<div id="charRow" style="margin-bottom:16px;"><div class="chips" id="savedChars"></div></div>
<div class="tabbar">
  <button class="tab active" data-tab="create">Create Prompt</button>
  <button class="tab" data-tab="presets">Quick Preset</button>
</div>
<div id="tab-create">
<div id="sections"></div>
</div>
<div id="tab-presets" style="display:none">
<div id="presets"></div>
</div>

<div id="presetModal" style="display:none">
<div class="modal-box">
  <h3>💾 Save preset</h3>
  <label>Pose title <input type="text" id="presetTitle" placeholder="e.g. Thinking pose"></label>
  <label>Description (optional) <input type="text" id="presetDesc" placeholder="e.g. for the library scene"></label>
  <div class="btnrow">
    <button class="action" id="presetSaveGo" style="background:#4f7cff;color:#fff;flex:1">Save</button>
    <button class="action" id="presetCancel" style="background:#2a3044;color:#cfd4e4">Cancel</button>
  </div>
</div>
</div>

<div class="output-wrap">
<div class="output-inner">
  <h2>Generated Prompt <span id="copied">✓ copied!</span></h2>
  <div id="output">Select body parts above…</div>
  <div class="btnrow">
    <button class="action" id="copyBtn">📋 Copy Prompt</button>
    <button class="action" id="savePresetBtn" style="background:#2a3044;color:#cfd4e4;">💾 Save preset</button>
    <button class="action" id="randomBtn">🎲 Random</button>
    <button class="action" id="clearBtn">Clear</button>
  </div>
</div>
</div>

<script>
const MODES = {
  human: { arm: 'arm', hand: 'hand', leg: 'leg' },
  dog:   { arm: 'front leg', hand: 'paw', leg: 'hind leg' }
};
let mode = 'human';
const sel = {}; // part -> option index

const PARTS = [
  { id:'head', label:'Head', opts:[
    ['facing camera','head is facing the camera','မျက်နှာတည့်တည့်'],
    ['facing right','head is facing right','ခေါင်းညာလှည့်'],
    ['facing left','head is facing left','ခေါင်းဘယ်လှည့်'],
    ['looking upward','head is looking upward','ခေါင်းမော့'],
    ['looking downward','head is looking downward','ခေါင်းငုံ့'],
    ['tilted right','head is tilted to the right','ခေါင်းညာစောင်း'],
    ['tilted left','head is tilted to the left','ခေါင်းဘယ်စောင်း'],
  ]},
  { id:'eyes', label:'Eyes', opts:[
    ['at camera','eyes are looking at the camera','ကင်မရာကိုကြည့်'],
    ['looking right','eyes are looking to the right','ညာဘက်ကြည့်'],
    ['looking left','eyes are looking to the left','ဘယ်ဘက်ကြည့်'],
    ['looking upward','eyes are looking upward','အပေါ်ကြည့်'],
    ['looking downward','eyes are looking downward','အောက်ကြည့်'],
    ['closed','eyes are closed','မျက်လုံးမှိတ်'],
    ['winking','winking with one eye','မျက်လုံးတစ်ဖက်မှိတ်'],
  ]},
  { id:'mouth', label:'Mouth', opts:[
    ['closed','mouth is closed','ပါးစပ်ပိတ်'],
    ['smiling','mouth is smiling','ပြုံး'],
    ['open talking','mouth is open, talking','စကားပြော'],
    ['open singing','mouth is open, singing','သီချင်းဆို'],
    ['frowning','mouth is frowning','မျက်နှာရှုံ့'],
    ['tongue out','tongue is sticking out','လျှာထုတ်'],
    ['biting lip','biting the lower lip','နှုတ်ခမ်းကိုက်'],
  ]},
  { id:'body', label:'Body Position', opts:[
    ['standing upright','body is standing upright','မတ်တပ်ရပ်'],
    ['tilted left','body is tilted to the left','ကိုယ်ဘယ်စောင်း'],
    ['tilted right','body is tilted to the right','ကိုယ်ညာစောင်း'],
    ['leaning forward','body is leaning forward','အရှေ့ကိုင်း'],
    ['leaning back','body is leaning back','အနောက်လှန်'],
    ['sitting','body is sitting','ထိုင်'],
    ['crouching','body is crouching','ဒူးကွေးထိုင်'],
    ['lying down','body is lying down','လှဲ'],
  ]},
  { id:'view', label:'View', opts:[
    ['front facing','facing the camera','အရှေ့တည့်တည့်မြင်'],
    ['3/4 facing left','in three-quarter view facing left','၃/၄ မြင် (ဘယ်လှည့်)'],
    ['3/4 facing right','in three-quarter view facing right','၃/၄ မြင် (ညာလှည့်)'],
    ['slight 3/4 facing left','in slight three-quarter view facing left','၃/၄ အနည်းငယ် (ဘယ်လှည့်)'],
    ['slight 3/4 facing right','in slight three-quarter view facing right','၃/၄ အနည်းငယ် (ညာလှည့်)'],
    ['profile side view','in profile side view','ဘေးတစ်ခြမ်းမြင်'],
    ['back view','seen from behind','နောက်ကျောမြင်'],
  ]},
  { id:'visibility', label:'Visibility', opts:[
    ['full body','full body visible','တစ်ကိုယ်လုံးမြင်'],
    ['upper body','upper body visible','ခါးအထက်မြင်'],
    ['head and shoulders','head and shoulders visible','ခေါင်းပုခုံးမြင်'],
  ]},
  { id:'rarm', label:'Right Arm', side:'right', kind:'arm', opts:[
    ['at side','{side} {arm} is resting at the side','{s}လက်ဘေးချ'],
    ['raised up','{side} {arm} is raised up','{s}လက်မြှောက်'],
    ['on hip','{side} {hand} is on the hip','{s}လက်ခါးထောက်'],
    ['pointing','{side} {arm} is pointing forward','{s}လက်ညိုးထိုး'],
    ['waving','{side} {arm} is waving','{s}လက်လှုပ်'],
    ['holding','{side} {hand} is holding an object','{s}လက်ကပစ္စည်းကိုင်'],
    ['crossed','arms are crossed','လက်ပိုက်'],
    ['spread wide','{side} {arm} is spread wide open','{s}လက်ဖြန့်ကား'],
    ['behind back','{side} {arm} is behind the back','{s}လက်နောက်ထား'],
    ['reaching forward','{side} {arm} is reaching forward','{s}လက်ဆန့်ထုတ်'],
  ]},
  { id:'larm', label:'Left Arm', side:'left', kind:'arm', opts:[
    ['at side','{side} {arm} is resting at the side','{s}လက်ဘေးချ'],
    ['raised up','{side} {arm} is raised up','{s}လက်မြှောက်'],
    ['on hip','{side} {hand} is on the hip','{s}လက်ခါးထောက်'],
    ['pointing','{side} {arm} is pointing forward','{s}လက်ညိုးထိုး'],
    ['waving','{side} {arm} is waving','{s}လက်လှုပ်'],
    ['holding','{side} {hand} is holding an object','{s}လက်ကပစ္စည်းကိုင်'],
    ['crossed','arms are crossed','လက်ပိုက်'],
    ['spread wide','{side} {arm} is spread wide open','{s}လက်ဖြန့်ကား'],
    ['behind back','{side} {arm} is behind the back','{s}လက်နောက်ထား'],
    ['reaching forward','{side} {arm} is reaching forward','{s}လက်ဆန့်ထုတ်'],
  ]},
  { id:'rhand', label:'Right Hand', side:'right', kind:'hand', opts:[
    ['open','{side} {hand} is open','{s}လက်ဖဝါးဖြန့်'],
    ['fist','{side} {hand} is a fist','{s}လက်သီးဆုပ်'],
    ['pointing','{side} {hand} is pointing','{s}လက်ညိုးထိုး'],
    ['thumbs up','{side} {hand} is giving a thumbs up','{s}လက်မထောင်'],
    ['palms together','{side} {hand} is pressed together in prayer','{s}လက်အုပ်ချီ'],
    ['clapping','{side} {hand} is clapping','{s}လက်ခုပ်တီး'],
    ['clasped','{side} {hand} is clasped together','{s}လက်ယှက်ထား'],
  ]},
  { id:'lhand', label:'Left Hand', side:'left', kind:'hand', opts:[
    ['open','{side} {hand} is open','{s}လက်ဖဝါးဖြန့်'],
    ['fist','{side} {hand} is a fist','{s}လက်သီးဆုပ်'],
    ['pointing','{side} {hand} is pointing','{s}လက်ညိုးထိုး'],
    ['thumbs up','{side} {hand} is giving a thumbs up','{s}လက်မထောင်'],
    ['palms together','{side} {hand} is pressed together in prayer','{s}လက်အုပ်ချီ'],
    ['clapping','{side} {hand} is clapping','{s}လက်ခုပ်တီး'],
    ['clasped','{side} {hand} is clasped together','{s}လက်ယှက်ထား'],
  ]},
  { id:'rleg', label:'Right Leg', side:'right', kind:'leg', opts:[
    ['straight','{side} {leg} is straight','{s}ခြေတန်း'],
    ['stepping forward','{side} {leg} is stepping forward','{s}ခြေလှမ်း'],
    ['bent','{side} {leg} is bent','{s}ခြေကွေး'],
    ['raised','{side} {leg} is raised','{s}ခြေမြှောက်'],
    ['feet together','{side} {leg} is standing, feet together','{s}ခြေပူးရပ်'],
    ['crossed','{side} {leg} is crossed','{s}ခြေယှက်'],
    ['tiptoes','{side} {leg} is on tiptoes','{s}ခြေဖျားထောက်'],
  ]},
  { id:'lleg', label:'Left Leg', side:'left', kind:'leg', opts:[
    ['straight','{side} {leg} is straight','{s}ခြေတန်း'],
    ['stepping forward','{side} {leg} is stepping forward','{s}ခြေလှမ်း'],
    ['bent','{side} {leg} is bent','{s}ခြေကွေး'],
    ['raised','{side} {leg} is raised','{s}ခြေမြှောက်'],
    ['feet together','{side} {leg} is standing, feet together','{s}ခြေပူးရပ်'],
    ['crossed','{side} {leg} is crossed','{s}ခြေယှက်'],
    ['tiptoes','{side} {leg} is on tiptoes','{s}ခြေဖျားထောက်'],
  ]},
];

const SINGLE_IDS = ['view','visibility','head','eyes','mouth','body'];
const PAIRS = [
  { ids:['rarm','larm'], key:'arm', name:'Arms', dogName:'Front Legs' },
  { ids:['rhand','lhand'], key:'hand', name:'Hands', dogName:'Paws' },
  { ids:['rleg','lleg'], key:'leg', name:'Legs', dogName:'Hind Legs' },
];
const both = { arm:false, hand:false, leg:false };
const PART_MAP = {};
PARTS.forEach(p => { PART_MAP[p.id] = p; });

const HOLD_PRESETS = ['a book', 'a pencil', 'a bag'];
let holdSel = null;
let holdCustom = '';
function holdingIdx() { return PART_MAP.rarm.opts.findIndex(o => o[0] === 'holding'); }
function isHolding() { const hi = holdingIdx(); return sel.rarm === hi || sel.larm === hi; }
function holdObject() {
  if (holdCustom.trim()) return holdCustom.trim();
  if (holdSel != null) return HOLD_PRESETS[holdSel];
  return 'an object';
}
const POINT_DIRS = [
  ['forward', 'pointing forward', 'အရှေ့ထိုး'],
  ['up', 'pointing up', 'အပေါ်ထိုး'],
  ['down', 'pointing down', 'အောက်ထိုး'],
  ['left', 'pointing to the left', 'ဘယ်ထိုး'],
  ['right', 'pointing to the right', 'ညာထိုး'],
  ['top left', 'pointing to the top left', 'အပေါ်ဘယ်ထိုး'],
  ['top right', 'pointing to the top right', 'အပေါ်ညာထိုး'],
];
let pointSel = 0;
function pointingIdx() { return PART_MAP.rarm.opts.findIndex(o => o[0] === 'pointing'); }
function isPointing() { const pi = pointingIdx(); return sel.rarm === pi || sel.larm === pi; }
function optOrder(p) {
  const ids = p.opts.map((_, i) => i);
  if (p.id === 'rarm' || p.id === 'larm') {
    const hi = holdingIdx(), pi = pointingIdx();
    return [hi, pi, ...ids.filter(i => i !== hi && i !== pi)];
  }
  return ids;
}
function pairOf(id) { return PAIRS.find(pr => pr.ids.includes(id)); }
function bothFill(text, kind) {
  const plural = { arm: mode === 'dog' ? 'both front legs' : 'both arms',
                   hand: mode === 'dog' ? 'both paws' : 'both hands',
                   leg: mode === 'dog' ? 'both hind legs' : 'both legs' }[kind];
  let t = text.replace('{side} ', '').replace('{side}', '')
              .replace('{arm}', plural).replace('{hand}', plural).replace('{leg}', plural);
  if (!t.startsWith('both')) t = 'both ' + t;
  return t.replace(' is ', ' are ');
}

const SHOTS = [
  ['close-up','close-up','အနီးကပ်ရိုက်'],
  ['medium shot','medium shot','တစ်ဝက်ရိုက်'],
  ['wide shot','wide shot','အကျယ်ရိုက်'],
  ['high angle','high angle','အပေါ်စီးရိုက်'],
  ['low angle','low angle','အောက်စီးရိုက်'],
  ['eye level','eye level','မျက်လုံးအဆင့်ရိုက်'],
  ['over-the-shoulder','over-the-shoulder','ပုခုံးကျော်ရိုက်'],
  ['dutch angle','dutch angle','စောင်းရိုက်'],

function fill(text, part) {
  const m = MODES[mode];
  return text.replace('{side}', part.side || '')
             .replace('{arm}', m.arm).replace('{hand}', m.hand).replace('{leg}', m.leg);
}

function renderExpression(box) {
  const sec = document.createElement('div');
  sec.className = 'section';

  h.innerHTML = `Expression `;

  x.className = 'x';
  x.textContent = 'RESET';
  x.title = 'Remove expression';
  x.onclick = () => { delete sel.expression; render(); update(); };
  h.appendChild(x);
  sec.appendChild(h);
  const chips = document.createElement('div');
  chips.className = 'chips';
  EXPRESSIONS.forEach((e, i) => {
    const c = document.createElement('button');
    const isSel = sel.expression === i;
    c.className = 'chip' + (isSel ? ' selected' : '');
    c.innerHTML = e.mm ? `${e.label}<small>${e.mm}</small>` : e.label;
    c.onclick = () => { sel.expression = sel.expression === i ? undefined : i; render(); update(); };
    chips.appendChild(c);
  });

    const sug = EXPRESSIONS[sel.expression].suggestions;
    if (sug && sug.length) {
      const t = document.createElement('div');
      t.style.cssText = 'font-size:12px;color:#8f96ad;margin:10px 0 6px;';

        b.onclick = () => { Object.assign(sel, s.map); render(); update(); };
        row.appendChild(b);
      });
      sec.appendChild(row);

}

function sectionEl(p) {
    const sec = document.createElement('div');
    sec.className = 'section';
    let label = p.label;
    if (mode === 'dog') {
      label = label.replace('Arm', 'Front Leg').replace('Hand', 'Paw').replace('Leg', 'Hind Leg');
    }
    const h = document.createElement('h2');
    h.innerHTML = `${label} `;
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = 'RESET';
    x.title = 'Remove this part';
    x.onclick = () => { const pr = pairOf(p.id); if (pr && both[pr.key]) pr.ids.forEach(id => delete sel[id]); else delete sel[p.id]; render(); update(); };
    h.appendChild(x);
    sec.appendChild(h);
    const chips = document.createElement('div');
    chips.className = 'chips';
    optOrder(p).forEach(i => {
      const [lab, , mm] = p.opts[i];
      const c = document.createElement('button');
      const isSel = sel[p.id] === i;
      c.className = 'chip' + (isSel ? ' selected' : '');
      const mmT = mm ? mm.split('{s}').join(p.side === 'right' ? 'ညာ' : p.side === 'left' ? 'ဘယ်' : '') : '';
      c.innerHTML = mmT ? `${lab}<small>${mmT}</small>` : lab;
      c.onclick = () => {
        const pr = pairOf(p.id);
        if (sel[p.id] === i) {
          if (pr && both[pr.key]) pr.ids.forEach(id => delete sel[id]); else delete sel[p.id];
        } else if (pr && both[pr.key]) {
          pr.ids.forEach(id => { sel[id] = i; });
        } else sel[p.id] = i;
        render(); update();
      };
      chips.appendChild(c);
    });
    sec.appendChild(chips);
    return sec;
}

function buildPrompt() {
  const name = document.getElementById('charName').value.trim() || 'The character';
  const bits = [];
  SINGLE_IDS.forEach(id => {
    if (id === 'view' || id === 'visibility') return;
    const p = PART_MAP[id];
    if (sel[p.id] !== undefined) bits.push(fill(p.opts[sel[p.id]][1], p));
    if (id === 'mouth' && sel.expression !== undefined) bits.push(EXPRESSIONS[sel.expression].text);
  });
  PAIRS.forEach(pr => {
    const r = PART_MAP[pr.ids[0]], l = PART_MAP[pr.ids[1]];
    if (both[pr.key] && sel[r.id] !== undefined && sel[r.id] === sel[l.id]) {
      bits.push(bothFill(r.opts[sel[r.id]][1], pr.key));
    } else {
      [r, l].forEach(p => { if (sel[p.id] !== undefined) bits.push(fill(p.opts[sel[p.id]][1], p)); });
    }
  });
  const v = sel.view !== undefined ? PART_MAP.view.opts[sel.view][1] : '';
  if (!bits.length && !Object.keys(selShots).length && !v) return '';
  const subject = v ? `${name} ${v}` : name;
  let out = bits.length ? `${subject} - ${bits.join(', ')}.` : `${subject}.`;
  const shots = Object.keys(selShots).sort((a,b) => a-b).map(i => SHOTS[i][1]);
  if (sel.visibility !== undefined) {
    const t = PART_MAP.visibility.opts[sel.visibility][1];
    out += ` ${t[0].toUpperCase()}${t.slice(1)}.`;
  }
  if (shots.length) out += ` Shot: ${shots.join(', ')}.`;
  const locks = LOCKED.filter(c => {
    if (!lockOn[c.id]) return false;
    if (c.id === 'fullbody' && sel.visibility !== undefined && sel.visibility !== 0) return false;
    return true;
  }).map(c => c.text);
  if (locks.length) out += ` Locked: ${locks.join('; ')}.`;
  out = out.replace(/holding an object/g, 'holding ' + holdObject());
  out = out.replace(/pointing forward/g, POINT_DIRS[pointSel][1]);
  return out;
}

function update() {
  document.getElementById('output').textContent = buildPrompt() || 'Select body parts above…';
}

document.getElementById('charName').addEventListener('input', update);

function switchTab(name) {
  document.querySelectorAll('.tabbar .tab').forEach(x => x.classList.toggle('active', x.dataset.tab === name));
  document.getElementById('tab-create').style.display = name === 'create' ? '' : 'none';
  document.getElementById('tab-presets').style.display = name === 'presets' ? '' : 'none';
}
document.querySelectorAll('.tabbar .tab').forEach(t => {
  t.onclick = () => switchTab(t.dataset.tab);
});

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

let savedPresets = [];
try { savedPresets = JSON.parse(localStorage.getItem('pm_presets') || '[]'); } catch(e) { savedPresets = []; }
function persistPresets() { try { localStorage.setItem('pm_presets', JSON.stringify(savedPresets)); } catch(e) {} }

document.getElementById('savePresetBtn').onclick = () => {
  document.getElementById('presetTitle').value = '';
  document.getElementById('presetDesc').value = '';
  document.getElementById('presetModal').style.display = 'flex';
  setTimeout(() => document.getElementById('presetTitle').focus(), 50);
};
document.getElementById('presetCancel').onclick = () => { document.getElementById('presetModal').style.display = 'none'; };
document.getElementById('presetModal').onclick = (e) => { if (e.target.id === 'presetModal') e.target.style.display = 'none'; };
function doSavePreset() {
  const title = document.getElementById('presetTitle').value.trim();
  if (!title) { document.getElementById('presetTitle').focus(); return; }
  savedPresets.push({
    title,
    desc: document.getElementById('presetDesc').value.trim(),
    sel: JSON.parse(JSON.stringify(sel)),
    shots: JSON.parse(JSON.stringify(selShots)),
    both: JSON.parse(JSON.stringify(both)),
    locks: JSON.parse(JSON.stringify(lockOn)),
  });
  persistPresets();
  document.getElementById('presetModal').style.display = 'none';
  render(); update();
  switchTab('presets');
}
document.getElementById('presetSaveGo').onclick = doSavePreset;
document.getElementById('presetTitle').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSavePreset(); });
document.getElementById('presetDesc').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSavePreset(); });
document.getElementById('copyBtn').onclick = async () => {
  const t = buildPrompt();
  if (!t) return;
  try { await navigator.clipboard.writeText(t); }
  catch { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  const el = document.getElementById('copied');
  el.style.opacity = 1;
  setTimeout(() => el.style.opacity = 0, 1500);
};
document.getElementById('clearBtn').onclick = () => { Object.keys(sel).forEach(k => delete sel[k]); Object.keys(selShots).forEach(k => delete selShots[k]); render(); update(); };
document.getElementById('randomBtn').onclick = () => {
  PARTS.forEach(p => { sel[p.id] = Math.floor(Math.random() * p.opts.length); });
  PAIRS.forEach(pr => { if (both[pr.key]) sel[pr.ids[1]] = sel[pr.ids[0]]; });
  render(); update();
};

let savedChars = [];
try { savedChars = JSON.parse(localStorage.getItem('pm_characters') || '[]'); } catch(e) { savedChars = []; }
function persistChars() { try { localStorage.setItem('pm_characters', JSON.stringify(savedChars)); } catch(e) {} }
function renderSavedChars() {
  const box = document.getElementById('savedChars');
  box.innerHTML = '';
  savedChars.forEach((c, i) => {
    const wrap = document.createElement('span');
    wrap.className = 'saved-wrap';
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = '👤 ' + c.name;
    b.onclick = () => {
      document.getElementById('charName').value = c.name;
      update();
    };
    const x = document.createElement('span');
    x.className = 'saved-x';
    x.textContent = '✕';
    x.title = 'Remove character';
    x.onclick = (e) => { e.stopPropagation(); savedChars.splice(i, 1); persistChars(); renderSavedChars(); };
    wrap.appendChild(b);
    wrap.appendChild(x);
    box.appendChild(wrap);
  });
  document.getElementById('charRow').style.display = savedChars.length ? '' : 'none';
}
document.getElementById('saveCharBtn').onclick = () => {
  const name = document.getElementById('charName').value.trim() || 'The character';
  const ix = savedChars.findIndex(c => c.name === name);
  if (ix >= 0) savedChars[ix] = { name }; else savedChars.push({ name });
  persistChars();
  renderSavedChars();
};

renderSavedChars();
render(); update();
</script>
</body>
